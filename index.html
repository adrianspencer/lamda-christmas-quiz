<style>
:root{
  --bg:#12080d; --panel:#2a1017; --panel2:#3a151e; --cream:#f4dfc4; --ink:#2b170f; --gold:#d9bd8a; --red:#7b0f1b; --red2:#a61d28; --white:#fff7ef;

 --quiz-backdrop:url("assets/571f7acb7d9b.webp"); --join-screen-backdrop:url("assets/340a84473341.webp");}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white)}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
#app{min-height:100svh}
.landing{position:relative;min-height:100svh;background:#10070b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero{position:relative;line-height:0;flex:0 0 auto}
.hero img{display:block;width:100%;height:100%;object-fit:contain}
.portrait-scene{display:block}
.landscape-scene{display:none}
.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:5}
@media (orientation:portrait){
  .hero{width:min(100vw, calc(100svh * 390 / 759));height:100svh}
  .portrait-scene{display:block;width:100%;height:100%;object-fit:fill}
  .landscape-scene{display:none}
  .hit{left:30.8%;top:47.55%;width:25.9%;height:3.45%;border-radius:10px}
}
@media (orientation:landscape){
  .hero{width:min(100vw, calc(100svh * 1672 / 941));height:calc(min(100vw * 941 / 1672, 100svh))}
  .portrait-scene{display:none}
  .landscape-scene{display:block;width:100%;height:100%;object-fit:fill}
  .hit{left:39.55%;top:58.2%;width:12.1%;height:5.2%;border-radius:10px}
}
.panel-screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top, rgba(113,33,44,.35), transparent 35%), linear-gradient(180deg,#12080d 0%,#231018 100%)}

.copy{color:#f7e7d0;opacity:.92;line-height:1.5;text-align:center;margin:0 0 18px}

.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#f1dcc2;font-weight:700;gap:10px}
.question{background:#f7ead6;color:#301b13;border-radius:18px;padding:18px;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.question .label{font-family: Georgia, serif;color:#7d6048;font-style:italic;text-align:center;margin-bottom:10px}
.question h2{font-family: Georgia, serif;font-size:clamp(22px,5vw,30px);line-height:1.28;text-align:center;margin:0 0 18px;color:#2e180f}

.result-list{list-style:none;padding:0;margin:14px 0 0;color:#f7e7d0}

/* Approved landscape and portrait artworks. Invisible functional hit area over the artwork's printed button. */
.landing.restored-landing {width:100%;height:100svh;min-height:100svh;overflow:hidden;position:relative;display:block;padding:0;margin:0;background:#160a0c;}
.restored-landing .stage-composition {position:absolute;left:50%;top:50%;width:max(100vw, calc(100svh * 1670 / 942));height:max(100svh, calc(100vw * 941 / 1672));aspect-ratio:1672/941;transform:translate(-50%,-50%);}
.restored-landing .stage-photo {display:block;width:100%;height:100%;object-fit:fill;max-height:none;}
.restored-landing .case-action {position:absolute;left:33.273%;top:80.169%;width:32.550%;height:9.494%;z-index:4;}
.restored-landing .case-button {display:block;width:100%;height:100%;padding:0;margin:0;border:0;background:transparent !important;color:transparent;font-size:0;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent;box-shadow:none;opacity:0 !important;}
.restored-landing .case-button:focus-visible {outline:3px solid #fff4cd;outline-offset:3px;border-radius:12px;}
@media (max-width:699px) and (orientation:portrait){
 .restored-landing .stage-composition {width:max(100vw, calc(100svh * 941 / 1671));height:max(100svh, calc(100vw * 1671 / 941));aspect-ratio:941/1671;}
 .restored-landing .case-action {left:21.998%;top:73.026%;width:52.816%;height:5.502%;}
}

/* Consistent tactile feedback for all quiz buttons. */
button { cursor:pointer; touch-action:manipulation; transition:transform 110ms ease,filter 110ms ease,box-shadow 110ms ease; }
button:not(:disabled):active:not(.case-button),button.button-confirmed:not(:disabled):not(.case-button) { transform:translateY(4px) scale(.965) !important; filter:brightness(.65) !important; box-shadow:inset 0 3px 10px rgba(0,0,0,.5) !important; }
.restored-landing .case-button:active,.restored-landing .case-button:focus,.restored-landing .case-button:visited {transform:none !important;filter:none !important;box-shadow:none !important;background:transparent !important;}
.restored-landing .case-action {pointer-events:auto;}
@media (max-width:699px) and (orientation:portrait) {
  .restored-landing .stage-photo {transform-origin:51% 75%;}
}

.cta,.secondary,.option{min-height:48px;}
button:focus-visible { outline:3px solid #f5c76c; outline-offset:3px; }
.quiz-rules { margin:20px auto 16px; max-width:390px; display:grid; gap:11px; color:#f4e4ce; text-align:left; font-size:clamp(14px,3.6vw,17px); line-height:1.4; }

</head>
<body>
<div id="app"></div>
<script>
const PORTRAIT_SCENE = 'assets/landing-ios-maglite-v5.webp?torch=6';
const LANDSCAPE_SCENE = 'assets/landing-desktop-maglite-v5.webp?torch=6';
const OLD_QUESTIONS = [{"q": "Which building was the gateway to our LAMDA world?", "options": ["The MacOwan Theatre", "Tower House", "The Rehearsal Studio", "Upper Woburn Place"], "answer": 1}, {"q": "What was the full course name?", "options": ["Stage Management", "Technical Theatre", "Stage Management & Technical Theatre", "Production Arts"], "answer": 2}, {"q": "Which play title appears in our reunion design?", "options": ["Hamlet", "Annie Get Your Gun", "The Seagull", "Uncle Vanya"], "answer": 3}];
const API_BASE = ''; // Same-origin Cloudflare Pages Function at /api/lobby
const GAME_CODE = 'LAMDA1988';
let playerToken = sessionStorage.getItem('lamda_player_token') || '';
let hostToken = sessionStorage.getItem('lamda_host_token') || '';
let lobbyPoll = null;
let hostPinSet=false;
let game=null;
let gameBusy=false;
let answerDraft = '';
let answerDraftQuestion = -1;
let state = { view:'landing', player:'', index:0, answers:[], lobby:null, lobbyError:'', busy:false };

const RUDOLPH_IMAGE = "assets/b4e22ee49971.webp";
let RUDOLPH_PLAN={};
let rudolphTimers=[];
let rudolphPlayedQuestions=new Set();
let rudolphRunToken=0;
let rudolphScheduledQuestion=null;
let rudolphVisualState={index:null,side:null,phase:'hidden'};
function acceptSharedRudolphPlan(plan){
 if(!plan || Object.keys(plan).length!==12 || !Object.prototype.hasOwnProperty.call(plan,'0'))return;
 const changed=JSON.stringify(RUDOLPH_PLAN)!==JSON.stringify(plan);
 RUDOLPH_PLAN=plan;
 if(changed){
  rudolphPlayedQuestions.clear();
  clearRudolphTimers();
  rudolphScheduledQuestion=null;
  rudolphVisualState={index:null,side:null,phase:'hidden'};
 }
}
function persistRudolphPlayed(){}
function resetRudolphPlayed(){
 rudolphPlayedQuestions.clear();
 clearRudolphTimers();
 rudolphScheduledQuestion=null;
 rudolphVisualState={index:null,side:null,phase:'hidden'};
}
function clearRudolphTimers(){rudolphTimers.forEach(clearTimeout);rudolphTimers=[];rudolphRunToken++;}
function getRudolphCue(index){
 if(!Object.prototype.hasOwnProperty.call(RUDOLPH_PLAN,index))return null;
 const side=RUDOLPH_PLAN[index];
 const seed=(index*9301+49297)%233280;
 return {side,delay:1800+(seed%500),hold:1050+(seed%200)};
}
function scheduleRudolphCue(index){
 const cue=getRudolphCue(index);
 if(state.view==='host'||!cue||game?.phase!=='started'||game?.revealed)return;
 if(rudolphScheduledQuestion===index)return;
 clearRudolphTimers();
 rudolphScheduledQuestion=index;
 rudolphVisualState={index,side:cue.side,phase:'waiting'};
 if(rudolphPlayedQuestions.has(index)){rudolphVisualState.phase='done';return;}
 const token=++rudolphRunToken;
 rudolphTimers.push(setTimeout(()=>{
   if(token!==rudolphRunToken)return;
   const liveOverlay=document.querySelector('.theatre-art .rudolph-overlay');
   if(!liveOverlay || !document.body.contains(liveOverlay))return;
   rudolphPlayedQuestions.add(index);persistRudolphPlayed();
   rudolphVisualState={index,side:cue.side,phase:'show'};
   liveOverlay.style.zIndex='30';
   liveOverlay.style.visibility='visible';
   liveOverlay.style.opacity='1';
   liveOverlay.classList.add('show');
   rudolphTimers.push(setTimeout(()=>{
     if(token!==rudolphRunToken)return;
     const outOverlay=document.querySelector('.theatre-art .rudolph-overlay');
     if(!outOverlay)return;
     rudolphVisualState={index,side:cue.side,phase:'hide'};
     outOverlay.classList.add('hide');
     rudolphTimers.push(setTimeout(()=>{
       if(token!==rudolphRunToken)return;
       const finishedOverlay=document.querySelector('.theatre-art .rudolph-overlay');
       if(finishedOverlay){
         finishedOverlay.classList.remove('show','hide');
         finishedOverlay.style.visibility='hidden';
         finishedOverlay.style.opacity='0';
       }
       rudolphVisualState={index,side:cue.side,phase:'done'};
     },450));
   },cue.hold));
 },cue.delay));
}
function renderRudolphOverlay(index){
 const cue=getRudolphCue(index);
 if(state.view==='host'||!cue||game?.revealed)return '';
 const phase=rudolphVisualState.index===index?rudolphVisualState.phase:'waiting';
 const classes=phase==='show'?' show':phase==='hide'?' show hide':'';
 return `<div class="rudolph-overlay rudolph-${cue.side}${classes}" aria-hidden="true"><img class="rudolph-figure" src="${RUDOLPH_IMAGE}" alt=""/></div>`;
}

async function lobbyRequest(action, body={}) {
  const res = await fetch('/api/lobby', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:GAME_CODE,...body})});
  const data = await res.json().catch(()=>({error:'Server unavailable'}));
  if (!res.ok) throw new Error(data.error || 'Unable to connect to the lobby');
  return data;
}
function stopLobbyPoll(){if(lobbyPoll){clearInterval(lobbyPoll);lobbyPoll=null;}}
function startLobbyPoll(){stopLobbyPoll();lobbyPoll=setInterval(refreshLobby,2500);}
async function refreshLobby(){
  if(state.view!=='lobby' && state.view!=='host' && state.view!=='quiz' && state.view!=='results')return;
  try {const data=await lobbyRequest('status',{token:state.view==='host'?hostToken:playerToken});state.lobby=data;state.lobbyError='';if(data.phase==='started'||data.phase==='finished')await refreshGame();else render();}
  catch(e){state.lobbyError=e.message;render();}
}
async function joinLobby(){
  const name=(document.getElementById('nameInput')?.value||'').trim();
  if(!name){state.lobbyError='Please enter your name.';renderGateway();return;}
  state.busy=true;state.player=name;
  try{const data=await lobbyRequest('join',{name,token:playerToken});playerToken=data.token;sessionStorage.setItem('lamda_player_token',playerToken);sessionStorage.setItem('lamda_player_name',name);state.lobby=data;state.lobbyError='';state.view='lobby';startLobbyPoll();render();}
  catch(e){state.lobbyError=e.message;state.view='gateway';render();}
  finally{state.busy=false;}
}
async function openHost(){
  state.view='host';state.lobbyError='';render();
  try{const data=await lobbyRequest('host',{token:hostToken});hostToken=data.token;sessionStorage.setItem('lamda_host_token',hostToken);state.lobby=data;hostPinSet=!!data.pinSet;startLobbyPoll();render();}
  catch(e){state.lobbyError=e.message;render();}
}
async function unlockHost(){
 const pin=document.getElementById('hostPin')?.value||'';
 try{const data=await lobbyRequest('host',{pin});hostToken=data.token;sessionStorage.setItem('lamda_host_token',hostToken);hostPinSet=!!data.pinSet;state.lobby=data;state.lobbyError='';startLobbyPoll();render();}
 catch(e){state.lobbyError=e.message;render();}
}
async function saveHostPin(){
 const pin=document.getElementById('hostPin')?.value||'';
 try{const data=await lobbyRequest('set_pin',{token:hostToken,pin});hostPinSet=true;state.lobby=data;state.lobbyError='';render();}
 catch(e){state.lobbyError=e.message;render();}
}
async function hostStart(){
 try{resetRudolphPlayed();state.lobby=await lobbyRequest('start',{token:hostToken});state.lobbyError='';await refreshGame();}
 catch(e){state.lobbyError=e.message;render();}
}
async function resetLobby(){
  if(!confirm('Reset the entire quiz? This deletes all submitted answers, scores and joined players. This cannot be undone.'))return;
  try{resetRudolphPlayed();state.lobby=await lobbyRequest('reset',{token:hostToken});game=null;answerDraft='';answerDraftQuestion=-1;render();}
  catch(e){state.lobbyError=e.message;render();}
}
function renderLobby(){
 const names=(state.lobby?.players||[]).map(p=>escapeHtml(p.name));
 if(game?.phase==='started'||game?.phase==='finished')return renderGame();
 app.innerHTML=`<section class="panel-screen"><div class="panel">
 <div class="brand"><h1>LAMDA <span class="sub">Christmas Quiz</span><span class="year">1988</span></h1></div>
 <div class="lobby-heading">YOU'RE IN, ${escapeHtml(state.player)}!</div>
 <p class="copy">${state.lobby?.phase==='started'?'Quiz started — waiting for the first question.':'Waiting for the quizmaster to start.'}</p>
 <div class="lobby-count">${names.length} <span>player${names.length===1?'':'s'} joined</span></div>
 <div class="lobby-names">${names.map(n=>`<span class="lobby-chip">${n}</span>`).join('')}</div>
 ${state.lobbyError?`<p class="lobby-error">${escapeHtml(state.lobbyError)}</p>`:''}
 <p class="lobby-note">Keep this page open. The quizmaster controls when we begin.</p>
 </div></section>`;
}
function renderHost(){
 const names=(state.lobby?.players||[]).map(p=>escapeHtml(p.name));
 const authorized=!!hostToken&&!state.lobbyError;
 if(authorized&&(game?.phase==='started'||game?.phase==='finished'))return renderGame();
 app.innerHTML=`<section class="panel-screen"><div class="panel">
 <div class="brand"><h1>LAMDA <span class="sub">Christmas Quiz</span><span class="year">1988</span></h1></div>
 <div class="lobby-heading">QUIZMASTER · ${state.lobby?.phase==='started'?'QUIZ STARTED':'LOBBY'}</div>
 ${!authorized?`<p class="copy">Enter your quizmaster PIN to open the controls.</p><input id="hostPin" type="password" inputmode="numeric" autocomplete="off" placeholder="Quizmaster PIN" maxlength="12"/><button class="cta full" onclick="pressedAction(this,unlockHost)">UNLOCK CONTROLS</button>`:''}
 ${authorized?`<div class="lobby-count">${names.length} <span>player${names.length===1?'':'s'} joined</span></div>
 <div class="lobby-names">${names.map(n=>`<span class="lobby-chip">${n}</span>`).join('')||'<span class="lobby-note">Waiting for players…</span>'}</div>
 ${!hostPinSet?`<p class="copy">Choose a private 4–12 digit quizmaster PIN. You'll use it to access these controls from another device.</p><input id="hostPin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Set quizmaster PIN" maxlength="12"/><button class="cta full" onclick="pressedAction(this,saveHostPin)">SAVE HOST PIN</button>`:
 state.lobby?.phase==='started'?`<p class="copy">The quiz has started. Players can see that the quizmaster is preparing the first question.</p>`:
 `<p class="copy">Ask everyone to join, then start when you're ready.</p><button class="cta full" ${names.length?'':'disabled'} onclick="pressedAction(this,hostStart)">START QUIZ</button>`}
 <button class="secondary full-secondary" onclick="pressedAction(this,resetLobby)">Clear Lobby</button>`:''}
 ${state.lobbyError?`<p class="lobby-error">${escapeHtml(state.lobbyError)}</p>`:''}
 <p class="lobby-note">Quizmaster controls the questions and marks each answer.</p>
 </div></section>`;
}


const app = document.getElementById('app');

function render(){
  if(state.view === 'landing') return renderLanding();
  if(state.view === 'gateway') return renderGateway();
  if(state.view === 'quiz') return renderGame();
  if(state.view === 'results') return renderGame();
  if(state.view === 'lobby') return renderLobby();
  if(state.view === 'host') return renderHost();
}

function renderLanding(){
  app.innerHTML = `
    <section class="landing restored-landing" aria-label="LAMDA Christmas Quiz 1988">
      <div class="stage-composition">
        <picture>
          <source media="(max-width: 699px) and (orientation: portrait)" srcset="${PORTRAIT_SCENE}">
          <img class="stage-photo" src="${LANDSCAPE_SCENE}" alt="LAMDA 1988 Christmas Quiz backstage scene with Tower House on the laptop and a leather Filofax" decoding="sync" fetchpriority="high" />
        </picture>
        <div class="case-action">
          <button class="case-button" onclick="pressedAction(this, enterQuiz)">ENTER THE QUIZ</button>
        </div>
      </div>
    </section>`;
}
function renderGateway(){
  app.innerHTML = `
    <section class="festive-join-screen" aria-label="Join the LAMDA Christmas Quiz">
      <div class="festive-join-card">
        <h1>JOIN THE QUIZ</h1>
        <div class="festive-join-rule" aria-hidden="true"></div>
        <label for="nameInput">Your Name</label>
        <input id="nameInput" class="festive-name-input" maxlength="40" autocomplete="name" placeholder="Enter your name..." value="${escapeHtml(state.player)}" />
        <button class="festive-join-button" onclick="pressedAction(this, joinLobby)">JOIN QUIZ</button>
        ${state.lobbyError ? `<p class="lobby-error">${escapeHtml(state.lobbyError)}</p>` : ''}
      </div>
    </section>`;
  const input = document.getElementById('nameInput');
  input?.focus();
  input?.addEventListener('keydown', e => { if(e.key === 'Enter') joinLobby(); });
}
async function gameRequest(action,extra={}){
 const res=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:state.view==='host'?hostToken:playerToken,...extra})});
 const data=await res.json();if(!res.ok)throw Error(data.error||'Game unavailable');return data;
}
async function refreshGame(){
 if(gameBusy)return;
 try{
  const previousGame=game;
  const previousIndex=game?.index;
  const previousSnapshot=previousGame ? JSON.stringify(previousGame) : '';
  const resultsList=document.querySelector('.results-live-list');
  const previousResultsScroll=resultsList ? resultsList.scrollTop : 0;
  game=await gameRequest('status');if(game?.rudolphPlan)acceptSharedRudolphPlan(game.rudolphPlan);state.lobbyError='';
  if(previousIndex!==undefined && previousIndex!==game.index){answerDraft='';answerDraftQuestion=-1;}
  if(state.view!=='host' && document.activeElement?.id==='gameAnswer' && game.phase==='started' && !game.answer && !game.revealed) return;
  // Do not rebuild an unchanged question every polling interval. Rebuilding
  // used to restart Rudolph's timer before it could reach its appearance time.
  if(previousSnapshot !== JSON.stringify(game)) render();
  if(game.phase==='finished' && previousResultsScroll>0){
   const updatedResultsList=document.querySelector('.results-live-list');
   if(updatedResultsList) updatedResultsList.scrollTop=previousResultsScroll;
  }
 }
 catch(e){state.lobbyError=e.message;render();}
}
async function doGame(action,extra={}){
 if(gameBusy)return;gameBusy=true;
 try{game=await gameRequest(action,extra);state.lobbyError='';render();}
 catch(e){state.lobbyError=e.message;render();}
 finally{gameBusy=false;}
}
const questionArtwork = ['assets/e5a00224093e-tab-clean-v2.webp', matchMedia('(max-width: 699px) and (orientation: portrait)').matches ? 'assets/guest-stage-velvet-portrait.webp' : 'assets/guest-christmas-stage.webp'].map(src => {
 const image = new Image();
 image.src = src;
 return image;
});
let questionArtworkReady = false;
let questionArtworkLoading = false;

async function prepareQuestionArtwork(){
 if(questionArtworkLoading)return;
 questionArtworkLoading=true;
 try{
  await Promise.all(questionArtwork.map(image=>image.decode()));
  questionArtworkReady=true;
 }catch{
  if(game?.phase==='started'){
   app.innerHTML='<section class="panel-screen"><div class="panel"><p>Question artwork could not load.</p><button class="cta" onclick="location.reload()">Retry</button></div></section>';
  }
 }finally{
  questionArtworkLoading=false;
 }
 if(questionArtworkReady && game?.phase==='started')render();
}
function mountFilofax(panel, alreadyVisible){
 const photo=questionArtwork[0];
 photo.alt='';
 photo.className='filofax-image';
 panel.prepend(photo);
 if(alreadyVisible){
  panel.classList.remove('artwork-pending');
  return;
 }
 // Give the mounted photograph a rendering opportunity before showing the controls.
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(panel.isConnected)panel.classList.remove('artwork-pending');
 }));
}
function renderGame(){
 if(!game)return renderLobby();
 const isHost=state.view==='host';
 if(game.phase==='finished'){
  const resultsList=(game.scores||[]).map((x,i)=>{const nameScale=Math.max(.58,1-Math.max(0,(x.name||'').length-12)*.035);return `<li class="${i===0?'results-winner':''}"><span class="results-place">${i+1}.</span><span class="results-player" style="font-size:${nameScale.toFixed(2)}em">${escapeHtml(x.name)}</span><strong class="results-points">${x.score} ${x.score===1?'point':'points'}</strong></li>`}).join('');
  app.innerHTML=`<section class="results-art-screen${isHost ? '' : ' player-results-screen'}" aria-label="Final results">
    <div class="results-art-stage" role="region" aria-label="LAMDA Christmas Quiz final results">
      <svg class="results-panel-image" viewBox="339 101 570 729" width="570" height="729" aria-hidden="true">
        <defs>
          <path id="results-cover" d="M 401 101 Q 365 101 350 130 Q 342 145 342 172 L 339 764 Q 338 809 364 822 Q 377 830 408 830 L 813 827 Q 874 827 879 775 L 882 549 L 897 548 Q 909 548 909 538 L 908 469 Q 907 458 895 458 L 882 458 L 882 168 Q 882 106 830 101 Z"/>
          <clipPath id="results-cover-clip"><use href="#results-cover"/></clipPath>
        </defs>
        <path d="M 401 101 Q 365 101 350 130 Q 342 145 342 172 L 339 764 Q 338 809 364 822 Q 377 830 408 830 L 813 827 Q 874 827 879 775 L 882 549 L 897 548 Q 909 548 909 538 L 908 469 Q 907 458 895 458 L 882 458 L 882 168 Q 882 106 830 101 Z" fill="black" stroke="black" stroke-width="8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <image x="339" y="101" width="570" height="729" href="assets/final-results-filofax.webp" clip-path="url(#results-cover-clip)"/>
      </svg>
      <ol class="results-live-list" tabindex="0" aria-label="Final scores">${resultsList}</ol>
      ${isHost ? '<button class="results-reset-hit" onclick="pressedAction(this,resetLobby)" aria-label="Reset for a new game"></button>' : ''}
    </div>
  </section>`;
  return;
 }
 if(game.phase!=='started')return isHost?renderHost():renderLobby();
 if(!questionArtworkReady){
  if(!questionArtworkLoading)app.innerHTML='<section class="panel-screen" role="status" aria-label="Loading question artwork"></section>';
  prepareQuestionArtwork();
  return;
 }
 const i=game.index;
 const answers=isHost?(game.answers||[]).filter(a=>a.question_index===i):[];
 const myAnswer=game.answer;
 if(answerDraftQuestion!==i){answerDraft='';answerDraftQuestion=i;}
 const rudolphOverlay=renderRudolphOverlay(i);
 const filofaxVisible=!!app.querySelector('.theatre-art:not(.artwork-pending) > .filofax-image');
 app.innerHTML=`<section class="panel-screen game-screen"><div class="panel filofax">
 <div class="theatre-art artwork-pending" aria-label="LAMDA Christmas Quiz question">
 <div class="question-count"><span>Question ${String(i+1).padStart(2,'0')}</span><span>of 25</span></div>
 <div class="question-copy">${escapeHtml(game.question||'')}</div>
 ${rudolphOverlay}
 ${!isHost&&!myAnswer&&!game.revealed?`<textarea id="gameAnswer" class="answer-field" maxlength="400" aria-label="Type your answer" placeholder="Type your answer here" oninput="answerDraft=this.value">${escapeHtml(answerDraft)}</textarea><button class="answer-button" aria-label="Submit Answer" onclick="submitGameAnswer()">SUBMIT ANSWER</button>`:''}
 <div class="game-state">${!isHost&&myAnswer?`✓ Answer submitted: ${escapeHtml(myAnswer)}`:''}${!isHost&&!myAnswer&&game.revealed?'<div>Answer window closed.</div>':''}${game.revealed?`<div><strong>ANSWER:</strong> ${escapeHtml(game.correctAnswer)}</div>`:''}${!isHost&&!myAnswer&&!game.revealed?'':''}</div>
 </div>
 ${isHost?`<div class="theatre-controls"><h3>Quizmaster · Submitted answers (${answers.length})</h3>${answers.map(a=>`<div class="mark-row"><span><strong>${escapeHtml(a.name)}</strong>: ${escapeHtml(a.answer)}</span><span><button class="mark-btn ${a.correct===1?'active':''}" aria-label="Mark ${escapeHtml(a.name)} correct" title="Award one point" onclick="doGame('mark',{index:${i},playerToken:'${a.player_token}',correct:${a.correct===1?0:1}})">✓</button></span></div>`).join('')||'<p>Waiting for answers…</p>'}<div class="row" style="margin-top:18px">${!game.revealed?`<button class="cta full" onclick="doGame('reveal')">REVEAL ANSWER</button>`:i===24?`<button class="cta full" onclick="doGame('finish')">SHOW FINAL RANKINGS</button>`:`<button class="cta full" onclick="doGame('advance')">NEXT QUESTION →</button>`}</div><button type="button" class="secondary full-secondary reset-text-link" onclick="resetLobby()" style="background:transparent!important;color:#201410!important;border:0!important;box-shadow:none!important;text-decoration:underline!important;text-underline-offset:3px!important;font-weight:700!important;cursor:pointer!important">RESET QUIZ &amp; CLEAR PLAYERS</button>${state.lobbyError?`<p class="lobby-error">${escapeHtml(state.lobbyError)}</p>`:''}</div>`:''}
 </div></section>`;
 mountFilofax(app.querySelector('.theatre-art'),filofaxVisible);
 fitQuestionText();
 scheduleRudolphCue(i);
}
function fitQuestionText(){
 const fit=()=>{
  const el=document.querySelector('.theatre-art .question-copy');
  if(!el)return;
  const base=parseFloat(el.dataset.baseFont)||parseFloat(getComputedStyle(el).fontSize)||18;
  const min=11;
  el.style.setProperty('box-sizing','border-box','important');
  el.style.setProperty('min-height','0','important');
  el.style.setProperty('overflow','hidden','important');
  el.style.setProperty('line-height','1.12','important');
  let low=min,high=base,best=min;
  el.style.setProperty('font-size',base+'px','important');
  if(el.scrollHeight<=el.clientHeight+1)best=base;
  else{
   for(let n=0;n<14;n++){
    const mid=(low+high)/2;
    el.style.setProperty('font-size',mid+'px','important');
    if(el.scrollHeight<=el.clientHeight+1){best=mid;low=mid;}
    else high=mid;
   }
  }
  el.style.setProperty('font-size',best+'px','important');
 };
 fit();
 requestAnimationFrame(()=>{fit();requestAnimationFrame(fit);});
}
async function submitGameAnswer(){
 const v=(document.getElementById('gameAnswer')?.value||answerDraft).trim();
 if(!v)return;
 answerDraft=v;
 await doGame('answer',{answer:v});
}
function pressedAction(button, action){
  if(button.disabled || button.dataset.pressing === 'true') return;
  button.dataset.pressing = 'true';
  button.classList.add('button-confirmed');
  window.setTimeout(() => { action(); }, 190);
}
function escapeHtml(s){return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function enterQuiz(){ state.view='gateway'; state.lobbyError=''; render(); }
function goBack(){ state.view='landing'; render(); }
// Restore the existing session after a refresh instead of returning to the landing page.
async function restoreSession(){
 const params=new URLSearchParams(location.search);
 if(params.get('host')==='1'){
  await openHost();
  if(hostToken && (state.lobby?.phase==='started'||state.lobby?.phase==='finished')) await refreshGame();
  return;
 }
 if(!playerToken){render();return;}
 state.player=sessionStorage.getItem('lamda_player_name')||'';
 try{
  const data=await lobbyRequest('status',{token:playerToken});
  state.lobby=data;
  state.lobbyError='';
  if(data.phase==='started'||data.phase==='finished'){
   state.view='quiz';
   await refreshGame();
  }else{
   state.view='lobby';
   render();
  }
  startLobbyPoll();
 }catch(e){
  // The token may belong to a lobby that has since been cleared.
  sessionStorage.removeItem('lamda_player_token');
  sessionStorage.removeItem('lamda_player_name');
  playerToken='';
  state.view='landing';
  render();
 }
}
restoreSession();
</script>
</body>
</html>
