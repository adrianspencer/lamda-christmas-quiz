<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1319">
<title>LAMDA Christmas Quiz · Class of 1988</title>
<style>
:root{
  --bg:#140f14;
  --panel:rgba(25,18,26,.78);
  --panel-strong:rgba(25,18,26,.92);
  --border:rgba(255,255,255,.14);
  --text:#fff8f8;
  --muted:#dcc6cf;
  --accent:#e42046;
  --accent2:#ff9c84;
  --gold:#f3d48c;
  font-family:Inter,"Avenir Next",Avenir,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#4c2133 0%,#1a1319 42%,#120c12 100%);color:var(--text)}
body{min-height:100svh}
button,input{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.hidden{display:none!important}
.app{min-height:100svh}
.screen{min-height:100svh;padding:0;display:flex;align-items:stretch;justify-content:center}
.wrap{width:min(100%,980px)}
.hero-wrap{position:relative;min-height:100svh;overflow:hidden;background:#110d10}
.hero-photo{
  position:absolute;inset:0;
  background-image:url('https://qattanfoundation.org/sites/default/files/outside-ar.jpg');
  background-size:cover;
  background-position:center;
  filter:saturate(1.03) contrast(1.02);
}
.hero-photo::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(17,11,16,.24) 0%,rgba(17,11,16,.18) 24%,rgba(17,11,16,.42) 62%,rgba(17,11,16,.84) 100%),
    radial-gradient(circle at 50% 18%,rgba(255,214,120,.16),transparent 32%);
}
.snow{position:absolute;inset:0;pointer-events:none;opacity:.48;
  background-image:
    radial-gradient(circle at 8% 20%, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
    radial-gradient(circle at 24% 10%, rgba(255,255,255,.75) 0 1.2px, transparent 1.7px),
    radial-gradient(circle at 33% 28%, rgba(255,255,255,.95) 0 1px, transparent 1.6px),
    radial-gradient(circle at 51% 14%, rgba(255,255,255,.8) 0 1.2px, transparent 1.7px),
    radial-gradient(circle at 68% 23%, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
    radial-gradient(circle at 86% 16%, rgba(255,255,255,.82) 0 1.1px, transparent 1.7px),
    radial-gradient(circle at 12% 46%, rgba(255,255,255,.72) 0 1.1px, transparent 1.8px),
    radial-gradient(circle at 43% 52%, rgba(255,255,255,.92) 0 1px, transparent 1.6px),
    radial-gradient(circle at 80% 48%, rgba(255,255,255,.82) 0 1.1px, transparent 1.7px);
}
.garland{position:absolute;left:0;right:0;top:0;height:122px;pointer-events:none;background:
  radial-gradient(circle at 5% 40%, #2f7e4d 0 18px, transparent 19px),
  radial-gradient(circle at 13% 58%, #2d7348 0 20px, transparent 21px),
  radial-gradient(circle at 20% 36%, #245f39 0 17px, transparent 18px),
  radial-gradient(circle at 30% 62%, #2f7e4d 0 22px, transparent 23px),
  radial-gradient(circle at 39% 34%, #2a6942 0 18px, transparent 19px),
  radial-gradient(circle at 49% 57%, #2b7045 0 21px, transparent 22px),
  radial-gradient(circle at 59% 32%, #255d39 0 18px, transparent 19px),
  radial-gradient(circle at 70% 60%, #2f7e4d 0 22px, transparent 23px),
  radial-gradient(circle at 80% 34%, #2a6942 0 18px, transparent 19px),
  radial-gradient(circle at 90% 54%, #2f7e4d 0 20px, transparent 21px),
  linear-gradient(180deg,rgba(20,60,32,.95),rgba(20,60,32,.72));
  border-bottom:2px solid rgba(255,255,255,.08);
  box-shadow:0 10px 22px rgba(0,0,0,.25);
}
.garland::after{content:"";position:absolute;left:2%;right:2%;top:16px;height:60px;background:
  radial-gradient(circle at 6% 20%, #d71e45 0 7px, transparent 8px),
  radial-gradient(circle at 16% 72%, #f2d27a 0 7px, transparent 8px),
  radial-gradient(circle at 28% 38%, #cf1740 0 7px, transparent 8px),
  radial-gradient(circle at 38% 72%, #f2d27a 0 7px, transparent 8px),
  radial-gradient(circle at 50% 26%, #cf1740 0 7px, transparent 8px),
  radial-gradient(circle at 61% 75%, #f2d27a 0 7px, transparent 8px),
  radial-gradient(circle at 72% 30%, #cf1740 0 7px, transparent 8px),
  radial-gradient(circle at 84% 74%, #f2d27a 0 7px, transparent 8px),
  radial-gradient(circle at 95% 30%, #cf1740 0 7px, transparent 8px);
}
.holly{position:absolute;width:118px;height:118px;pointer-events:none;opacity:.96}
.holly:before,.holly:after{content:"";position:absolute;border-radius:60% 0 60% 0;background:#2f7e4d;width:48px;height:26px;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset}
.holly .leaf3,.holly .berry1,.holly .berry2,.holly .berry3{position:absolute}
.holly .leaf3{width:48px;height:26px;border-radius:60% 0 60% 0;background:#2f7e4d;transform:rotate(20deg);left:34px;top:16px}
.holly:before{left:14px;top:22px;transform:rotate(-34deg)}
.holly:after{left:48px;top:32px;transform:rotate(38deg)}
.holly .berry1,.holly .berry2,.holly .berry3{width:12px;height:12px;border-radius:50%;background:#d61c44;box-shadow:0 0 10px rgba(214,28,68,.3)}
.holly .berry1{left:48px;top:44px}.holly .berry2{left:60px;top:38px}.holly .berry3{left:58px;top:52px}
.holly.tl{top:106px;left:16px;transform:scale(1.0)}
.holly.br{bottom:18px;right:18px;transform:scale(1.0) rotate(180deg)}
.bulb{position:absolute;width:20px;height:28px;border-radius:50% 50% 46% 46%;background:linear-gradient(180deg,#f6d98f,#c69a35);box-shadow:0 0 14px rgba(246,217,143,.35)}
.bulb::before{content:"";position:absolute;left:5px;right:5px;top:-5px;height:7px;border-radius:3px;background:#86786f}
.b1{top:88px;left:9%}.b2{top:98px;right:13%;background:linear-gradient(180deg,#ef3656,#a70f31)}.b3{bottom:21%;left:7%;background:linear-gradient(180deg,#7fd8ff,#2f71b9)}
.hero-content{position:relative;z-index:3;min-height:100svh;display:flex;align-items:flex-end;padding:24px}
.hero-card{width:min(100%,520px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:26px;padding:24px 22px 22px;box-shadow:0 20px 70px rgba(0,0,0,.44)}
.label{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#f3c9d3;font-weight:800}
.slash{width:10px;height:30px;transform:skew(-18deg);background:var(--accent);display:inline-block}
h1,h2,p{margin:0}h1{font-size:clamp(32px,7vw,58px);line-height:.98;letter-spacing:-.055em;margin-bottom:14px}
h2{font-size:clamp(26px,5vw,40px);line-height:1.05;letter-spacing:-.045em;margin-bottom:10px}
.lead{margin-top:12px;color:var(--muted);font-size:16px;line-height:1.55}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn{appearance:none;border:none;border-radius:15px;padding:15px 19px;font-weight:800;min-height:54px;transition:transform .12s ease,opacity .12s ease,background .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(110deg,var(--accent),#b00f34);color:white;box-shadow:0 12px 26px rgba(145,8,34,.34)}
.btn-secondary{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.16)}
.note{margin-top:12px;color:#c8b0b8;font-size:12px;line-height:1.5}
.shell{width:min(100%,760px);margin:0 auto;padding:20px 14px 46px}
.panel{background:var(--panel-strong);border:1px solid var(--border);border-radius:24px;padding:24px 18px 22px;box-shadow:0 20px 60px rgba(0,0,0,.32)}
.sitehead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 4px 18px}
.brand{display:flex;align-items:center;gap:12px}.brand-words{display:flex;flex-direction:column;gap:2px}.brand-words strong{font-size:19px;letter-spacing:-.045em}.brand-words small{font-size:10px;letter-spacing:.21em;color:#e6c8d1;font-weight:800}
.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:#ff8e9d;font-weight:800;margin-bottom:10px}
.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ecd0d7;font-weight:800}.field input{width:100%;min-height:50px;border-radius:14px;padding:14px 15px;background:#19121a;border:1px solid rgba(255,255,255,.15);color:white;outline:none}.field input:focus{border-color:#ff8898;box-shadow:0 0 0 3px rgba(255,136,152,.12)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}
.notice{margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--border);color:#eddbe1;font-size:14px;line-height:1.5}
.progress{height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin:14px 0 24px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s ease}
.question{font-size:clamp(24px,4.4vw,34px);line-height:1.23;letter-spacing:-.04em;font-weight:800;margin-bottom:18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{appearance:none;width:100%;text-align:left;border-radius:16px;min-height:70px;padding:15px 16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:white;font-weight:750;display:flex;align-items:center;gap:12px}.choice:hover{background:rgba(255,255,255,.13)}.choice .letter{width:30px;height:30px;border-radius:50%;background:#982241;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 30px}.choice.correct{background:rgba(47,126,77,.35);border-color:#4adb9c}.choice.incorrect{background:rgba(155,25,63,.36);border-color:#ff6d8d}.choice.selected{border-color:#ff8798;background:rgba(155,25,63,.28)}
.result{font-size:46px;line-height:1;font-weight:900;letter-spacing:-.04em;margin:8px 0 14px}
.small{font-size:14px;line-height:1.55;color:var(--muted);margin-top:10px}
.footer{padding:22px 12px 8px;text-align:center;font-size:11px;color:#bbaab1;letter-spacing:.06em}
.fade-out{animation:fadeOut .42s ease forwards}.fade-in{animation:fadeIn .42s ease forwards}
@keyframes fadeOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.01)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:700px){
  .hero-card{margin-top:auto;width:100%;border-radius:24px 24px 0 0;padding:20px 18px 18px}
  .hero-content{padding:0}
  .shell{padding:14px 12px 40px}
  .panel{padding:22px 16px 18px}
  .choices{grid-template-columns:1fr}
  .sitehead{padding:8px 2px 14px}
  .holly.tl{top:88px;left:6px;transform:scale(.88)}
  .b3{display:none}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const app = document.getElementById('app');
const questions = [
  {q:'Where did our story begin?', a:['Tower House','Our house','The MacOwan Theatre','In the church hall'], correct:1},
  {q:'What does DSM stand for in theatre?', a:['Deputy Stage Manager','Director of Stage Movement','Drama Stage Mentor','Design & Stage Mechanics'], correct:0},
  {q:'What sort of reunion is this?', a:['Knockout tournament','Everyone plays to the end','Secret ballot','Pub crawl only'], correct:1}
];
let state = {screen:'landing', name:'', index:0, score:0, selected:null, answered:false};
const letters = ['A','B','C','D'];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  if(state.screen==='landing') return renderLanding();
  if(state.screen==='join') return renderJoin();
  if(state.screen==='waiting') return renderWaiting();
  if(state.screen==='quiz') return renderQuiz();
  if(state.screen==='result') return renderResult();
}
function brand(){return `<div class="brand"><span class="slash"></span><div class="brand-words"><strong>LAMDA Christmas Quiz</strong><small>CLASS OF 1988</small></div></div>`}
function renderLanding(){
  app.innerHTML = `
    <section class="screen">
      <div class="wrap hero-wrap fade-in">
        <div class="hero-photo"></div>
        <div class="snow"></div>
        <div class="garland"></div>
        <div class="holly tl"><span class="leaf3"></span><span class="berry1"></span><span class="berry2"></span><span class="berry3"></span></div>
        <div class="holly br"><span class="leaf3"></span><span class="berry1"></span><span class="berry2"></span><span class="berry3"></span></div>
        <div class="bulb b1"></div><div class="bulb b2"></div><div class="bulb b3"></div>
        <div class="hero-content">
          <div class="hero-card">
            <div class="label"><span class="slash"></span><span>Class of 1988</span></div>
            <h1>Back through<br>the door.</h1>
            <p class="lead">Tower House is the gateway. Christmas stays in the dressing, not in a fake zoom-through-the-door animation.</p>
            <div class="actions">
              <button class="btn btn-primary" id="enterBtn">ENTER THE QUIZ →</button>
              <button class="btn btn-secondary" id="rehearseBtn">TRY THE REHEARSAL</button>
            </div>
            <p class="note">Real Tower House photo with festive overlays. Next screen: name entry. No camera crash through the door.</p>
          </div>
        </div>
      </div>
    </section>`;
  document.getElementById('enterBtn').onclick = () => transitionTo('join');
  document.getElementById('rehearseBtn').onclick = () => transitionTo('join');
}
function renderJoin(){
  app.innerHTML = `
    <section class="screen fade-in">
      <div class="shell">
        <div class="sitehead">${brand()}<span class="muted">Phone-first rehearsal</span></div>
        <div class="panel">
          <div class="eyebrow">Welcome back</div>
          <h2>What’s your name?</h2>
          <p class="lead">Everyone stays in all the way through. Scores are just totalled up at the end.</p>
          <div class="field">
            <label for="playerName">Your name</label>
            <input id="playerName" maxlength="40" placeholder="Type your name" value="${esc(state.name)}">
          </div>
          <div class="row">
            <button class="btn btn-secondary" id="backBtn">Back</button>
            <button class="btn btn-primary" id="joinBtn">JOIN →</button>
          </div>
          <div class="notice">In the live version, this is where players join from their phones while you host on Zoom.</div>
        </div>
        <div class="footer">LAMDA CLASS OF 1988 · PROTOTYPE</div>
      </div>
    </section>`;
  document.getElementById('backBtn').onclick = () => transitionTo('landing');
  document.getElementById('joinBtn').onclick = () => {
    const v = document.getElementById('playerName').value.trim();
    if(!v){ document.getElementById('playerName').focus(); return; }
    state.name = v; transitionTo('waiting');
  };
}
function renderWaiting(){
  app.innerHTML = `
    <section class="screen fade-in">
      <div class="shell">
        <div class="sitehead">${brand()}<span class="muted">Waiting room</span></div>
        <div class="panel">
          <div class="eyebrow">You’re in</div>
          <h2>Welcome, ${esc(state.name)}.</h2>
          <p class="lead">Leave this open. Adrian hosts on Zoom and starts the quiz when everyone has arrived.</p>
          <div class="notice">This rehearsal preview runs on one device. The full live version will synchronise all phones.</div>
          <div class="row" style="margin-top:20px">
            <button class="btn btn-secondary" id="editNameBtn">Edit name</button>
            <button class="btn btn-primary" id="startRehearsalBtn">START REHEARSAL →</button>
          </div>
        </div>
        <div class="footer">NO ELIMINATION · EVERYBODY PLAYS TO THE END</div>
      </div>
    </section>`;
  document.getElementById('editNameBtn').onclick = ()=>transitionTo('join');
  document.getElementById('startRehearsalBtn').onclick = ()=>{ state.index=0; state.score=0; state.selected=null; state.answered=false; transitionTo('quiz'); };
}
function renderQuiz(){
  const q = questions[state.index];
  app.innerHTML = `
    <section class="screen fade-in">
      <div class="shell">
        <div class="sitehead">${brand()}<span class="muted">Question ${state.index+1} / ${questions.length}</span></div>
        <div class="panel">
          <div class="eyebrow">Question ${state.index+1} / ${questions.length}</div>
          <div class="progress"><span style="width:${((state.index+1)/questions.length)*100}%"></span></div>
          <div class="question">${esc(q.q)}</div>
          <div class="choices">
            ${q.a.map((answer,i)=>`<button class="choice ${buttonClass(i,q)}" data-index="${i}" ${state.answered?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(answer)}</span></button>`).join('')}
          </div>
          <p class="small" id="feedback">${feedbackText(q)}</p>
          <div class="row" style="margin-top:18px">
            <button class="btn btn-secondary ${state.answered?'':'hidden'}" id="nextBtn">${state.index===questions.length-1?'SEE RESULTS →':'NEXT QUESTION →'}</button>
          </div>
        </div>
        <div class="footer">HOST SPEAKS ON ZOOM · PLAYERS ANSWER HERE</div>
      </div>
    </section>`;
  document.querySelectorAll('.choice').forEach(btn=>btn.onclick = ()=> pickAnswer(Number(btn.dataset.index)));
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=> {
    if(state.index===questions.length-1){ transitionTo('result'); }
    else { state.index++; state.selected=null; state.answered=false; render(); }
  };
}
function buttonClass(i,q){
  if(!state.answered){ return state.selected===i ? 'selected' : ''; }
  if(i===q.correct) return 'correct';
  if(i===state.selected && i!==q.correct) return 'incorrect';
  return '';
}
function feedbackText(q){
  if(!state.answered) return 'Choose one answer. In the live version, the host reveals and advances each question.';
  return state.selected===q.correct ? 'Correct.' : 'Correct answer: ' + q.a[q.correct];
}
function pickAnswer(i){
  if(state.answered) return;
  state.selected=i; state.answered=true; if(i===questions[state.index].correct) state.score++; render();
}
function renderResult(){
  app.innerHTML = `
    <section class="screen fade-in">
      <div class="shell">
        <div class="sitehead">${brand()}<span class="muted">Curtain call</span></div>
        <div class="panel">
          <div class="eyebrow">Rehearsal complete</div>
          <h2>Nice one, ${esc(state.name)}.</h2>
          <div class="result">${state.score} / ${questions.length}</div>
          <p class="lead">This is the phone-first rehearsal flow: Tower House landing page, name entry, waiting room, one question at a time, then a final score.</p>
          <div class="row" style="margin-top:20px">
            <button class="btn btn-secondary" id="homeBtn">HOME</button>
            <button class="btn btn-primary" id="againBtn">PLAY AGAIN ↻</button>
          </div>
        </div>
        <div class="footer">NEXT STEP: CONNECT THE LIVE MULTIPLAYER VERSION</div>
      </div>
    </section>`;
  document.getElementById('homeBtn').onclick = ()=>transitionTo('landing');
  document.getElementById('againBtn').onclick = ()=>{ state.index=0; state.score=0; state.selected=null; state.answered=false; transitionTo('quiz'); };
}
function transitionTo(next){
  const current = app.firstElementChild;
  if(current){ current.classList.add('fade-out'); setTimeout(()=>{ state.screen = next; render(); }, 220); }
  else { state.screen = next; render(); }
}
render();
</script>
</body>
</html>
