<title>LAMDA Christmas Quiz</title>
<style>
:root{
  --bg:#12080d; --panel:#2a1017; --panel2:#3a151e; --cream:#f4dfc4; --ink:#2b170f; --gold:#d9bd8a; --red:#7b0f1b; --red2:#a61d28; --white:#fff7ef;
  font-family: Inter, Avenir, system-ui, -apple-system, sans-serif;
 --quiz-backdrop:url("assets/571f7acb7d9b.webp"); --join-screen-backdrop:url("assets/340a84473341.webp");}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white)}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
#app{min-height:100svh}
.landing{position:relative;min-height:100svh;background:#10070b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero{position:relative;line-height:0;flex:0 0 auto}
.hero img{display:block;width:100%;height:100%;object-fit:contain}
.portrait-scene{display:block}
.landscape-scene{display:none}
.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:5}
@media (orientation:portrait){
  .hero{width:min(100vw, calc(100svh * 390 / 759));height:100svh}
  .portrait-scene{display:block;width:100%;height:100%;object-fit:fill}
  .landscape-scene{display:none}
  .hit{left:30.8%;top:47.55%;width:25.9%;height:3.45%;border-radius:10px}
}
@media (orientation:landscape){
  .hero{width:min(100vw, calc(100svh * 1672 / 941));height:calc(min(100vw * 941 / 1672, 100svh))}
  .portrait-scene{display:none}
  .landscape-scene{display:block;width:100%;height:100%;object-fit:fill}
  .hit{left:39.55%;top:58.2%;width:12.1%;height:5.2%;border-radius:10px}
}
.panel-screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top, rgba(113,33,44,.35), transparent 35%), linear-gradient(180deg,#12080d 0%,#231018 100%)}
.panel{width:min(100%, 560px);background:rgba(38,16,23,.92);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.brand{font-family: Georgia, 'Times New Roman', serif;color:var(--cream);text-align:center;letter-spacing:.02em}
.brand h1{margin:0;font-size:clamp(30px,7vw,42px);font-weight:700;line-height:1}
.brand .sub{display:block;font-style:italic;font-size:clamp(22px,6vw,36px);margin-top:4px}
.brand .year{display:block;font-size:clamp(26px,6vw,36px);margin-top:2px}
.ribbon{margin:12px auto 18px;display:inline-block;background:#c8ab72;color:#31180f;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.copy{color:#f7e7d0;opacity:.92;line-height:1.5;text-align:center;margin:0 0 18px}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:#fbefdf;color:#2c1a12;font-size:18px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#982231 0%,#7a0f1c 100%);color:#fff9f2;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 18px;font-weight:800;letter-spacing:.01em;box-shadow:0 12px 24px rgba(117,16,28,.35)}
.cta.full{width:100%;margin-top:14px}
.secondary{background:transparent;border:1px solid rgba(255,255,255,.18);color:#fff7ef;border-radius:12px;padding:12px 16px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#f1dcc2;font-weight:700;gap:10px}
.question{background:#f7ead6;color:#301b13;border-radius:18px;padding:18px;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.question .label{font-family: Georgia, serif;color:#7d6048;font-style:italic;text-align:center;margin-bottom:10px}
.question h2{font-family: Georgia, serif;font-size:clamp(22px,5vw,30px);line-height:1.28;text-align:center;margin:0 0 18px;color:#2e180f}
.options{display:grid;gap:10px}
.option{width:100%;background:#fff6e9;color:#371f14;border:1px solid #d5b485;border-radius:12px;padding:13px 14px;text-align:left;font-weight:600}
.option.selected{background:#84111d;color:#fffdf8;border-color:#a31f2b}
.option.correct{background:#1f6d43;color:#fff;border-color:#2f9460}
.option.wrong{background:#8d1f29;color:#fff;border-color:#b33440}
.result-list{list-style:none;padding:0;margin:14px 0 0;color:#f7e7d0}
.result-list li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}

/* Approved landscape and portrait artworks. Invisible functional hit area over the artwork's printed button. */
.landing.restored-landing {width:100%;height:100svh;min-height:100svh;overflow:hidden;position:relative;display:block;padding:0;margin:0;background:#160a0c;}
.restored-landing .stage-composition {position:absolute;left:50%;top:50%;width:max(100vw, calc(100svh * 1670 / 942));height:max(100svh, calc(100vw * 941 / 1672));aspect-ratio:1672/941;transform:translate(-50%,-50%);}
.restored-landing .stage-photo {display:block;width:100%;height:100%;object-fit:fill;max-height:none;}
.restored-landing .case-action {position:absolute;left:37.3%;top:75.8%;width:30%;height:9.8%;z-index:4;}
.restored-landing .case-button {display:block;width:100%;height:100%;padding:0;margin:0;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;}
.restored-landing .case-button:focus-visible {outline:3px solid #fff4cd;outline-offset:3px;border-radius:12px;}
@media (max-width:699px) and (orientation:portrait){
 .restored-landing .stage-composition {width:max(100vw, calc(100svh * 941 / 1671));height:max(100svh, calc(100vw * 1671 / 941));aspect-ratio:941/1671;}
 .restored-landing .case-action {left:19%;top:71.7%;width:64%;height:6.6%;}
}

/* Consistent tactile feedback for all quiz buttons. */
button { cursor:pointer; touch-action:manipulation; transition:transform 110ms ease,filter 110ms ease,box-shadow 110ms ease; }
button:not(:disabled):active,button.button-confirmed:not(:disabled) { transform:translateY(4px) scale(.965) !important; filter:brightness(.65) !important; box-shadow:inset 0 3px 10px rgba(0,0,0,.5) !important; }
.restored-landing .case-action {pointer-events:auto;}
@media (max-width:699px) and (orientation:portrait) {
  .restored-landing .stage-photo {transform-origin:51% 75%;}
}

.cta,.secondary,.option{min-height:48px;}
button:focus-visible { outline:3px solid #f5c76c; outline-offset:3px; }
.quiz-rules { margin:20px auto 16px; max-width:390px; display:grid; gap:11px; color:#f4e4ce; text-align:left; font-size:clamp(14px,3.6vw,17px); line-height:1.4; }
.quiz-rules div { padding-left:18px; border-left:3px solid #bc925d; }

.lobby-heading{margin:24px 0 12px;text-align:center;color:var(--gold);font-size:17px;font-weight:800;letter-spacing:.08em}
.lobby-count{text-align:center;font-size:52px;color:var(--cream);font-weight:800;margin:12px 0}
.lobby-count span{display:block;font-size:15px;font-weight:500;color:#d8c2a5}
.lobby-names{min-height:75px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}
.lobby-chip{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:84px;min-height:84px;max-width:160px;padding:12px;text-align:center;line-height:1.2;overflow-wrap:anywhere;border:1px solid #9c7659;border-radius:999px;background:#42202a;color:#f6e4d0}
.lobby-note{color:#d8c2a5;text-align:center;font-size:13px;line-height:1.5}
.lobby-error{color:#ffb5b5;text-align:center;font-size:14px}
.full-secondary{display:block;width:100%;margin-top:12px}
button:disabled{opacity:.5;cursor:not-allowed}

.filofax{background:#ead8b5;color:#2f211a;border:7px double #704b3c;box-shadow:0 18px 65px #160b0c}.filofax .brand h1,.filofax .brand .sub,.filofax .brand .year{color:#4d2431}.filofax .question{background:#fff7e7;border-left:8px solid #ad7864;border-radius:3px}.filofax .progress,.filofax .lobby-note{color:#61443a}.answer-reveal{border-top:2px dashed #ad7864;padding-top:14px;text-align:center}.host-answers{padding:12px;background:#fff6e8;margin-top:16px;border-radius:8px}.mark-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #d6bfa2;padding:9px 0}.mark-btn{padding:8px 12px;margin-left:5px;border-radius:5px;background:#e5d4bf;border:1px solid #9d7d67;cursor:pointer}.mark-btn.active{background:#55835b;color:white}.filofax .result-list{color:#39251d}.filofax .ribbon{display:block;text-align:center}

/* Backstage atmosphere and vintage 1980s Filofax question sheets. */
.panel-screen.game-screen{background:linear-gradient(90deg,rgba(13,7,11,.78),rgba(21,11,15,.35),rgba(13,7,11,.8)),url("assets/98a23fce9da0.webp") center/cover fixed !important;min-height:100svh;padding:22px 12px;}
.panel.filofax{position:relative;max-width:680px;margin:20px auto;padding:30px 27px 30px 58px;background:repeating-linear-gradient(to bottom,#fff8e8 0px,#fff8e8 34px,#d5dce1 35px,#fff8e8 36px);border:2px solid #8a4d3c;border-left:19px solid #69382f;border-radius:12px 5px 5px 12px;box-shadow:8px 12px 0 #34211f,12px 17px 0 #8c5940,0 22px 65px #050203; font-family:Arial,Helvetica,sans-serif;color:#35251f;}
.panel.filofax:before{content:"";position:absolute;top:38px;bottom:32px;left:-10px;width:22px;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 44px,#bcb9ad 44px,#f7f5ec 49px,#77746e 54px,transparent 59px,transparent 94px);filter:drop-shadow(1px 1px 2px #302421);pointer-events:none;}
.panel.filofax:after{content:"1988  •  LAMDA";position:absolute;right:-11px;top:55px;writing-mode:vertical-rl;padding:13px 4px;background:#ad7752;border-radius:0 5px 5px 0;font-size:10px;font-weight:800;letter-spacing:.15em;color:#fff5de;}
.filofax .brand h1{font-family:Georgia,'Times New Roman',serif !important;font-size:clamp(26px,5vw,40px);letter-spacing:-.02em;color:#512c31 !important;}
.filofax .brand .sub,.filofax .brand .year{font-family:Georgia,'Times New Roman',serif !important;color:#512c31 !important;}
.filofax .question{border:0 !important;border-radius:0 !important;background:transparent !important;padding:16px 0 5px !important;box-shadow:none !important;}
.filofax .question h2{font-family:Georgia,'Times New Roman',serif !important;color:#34221e !important;font-size:clamp(23px,4.6vw,31px) !important;line-height:1.28 !important;text-align:left !important;}

.filofax textarea:focus{outline:3px solid #c59b61;outline-offset:2px;}

.filofax .cta:not(:disabled):active{transform:translateY(5px) !important;box-shadow:0 0 0 #341c20 !important;filter:brightness(.82) !important;}

@media(max-width:550px){.panel.filofax{padding:22px 19px 25px 35px;margin:12px auto;border-left-width:13px}.panel.filofax:before{left:-8px;width:15px}.panel.filofax:after{right:-8px;font-size:8px}}

  max-width:760px; position:relative; isolation:isolate;
  background:repeating-linear-gradient(to bottom,#f5e6c8 0px,#f5e6c8 35px,#d9c7aa 36px,#f5e6c8 37px);

@media(max-width:550px){.panel-screen.game-screen .panel.filofax{border-left-width:25px;padding:22px 19px 25px 32px}.panel-screen.game-screen .panel.filofax:before{left:-21px;width:41px}.panel-screen.game-screen .panel.filofax:after{display:none}}

/* Approved theatre artwork, scoped strictly to active question screens. */
.panel-screen.game-screen{background:#180c0a!important;min-height:100svh;padding:12px 8px 30px!important;display:block!important}
.panel-screen.game-screen .panel.filofax{max-width:700px!important;width:100%!important;margin:0 auto!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;overflow:visible!important}
.panel-screen.game-screen .panel.filofax:before,.panel-screen.game-screen .panel.filofax:after{display:none!important}
.theatre-art{position:relative;width:100%;aspect-ratio:1199/1312;isolation:isolate}
.theatre-art .question-count{position:absolute;top:15.9%;left:52%;width:27%;height:7.3%;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-1deg);background:#d98b80;color:#201410;font:700 clamp(10px,2.2vw,22px) 'Courier New',monospace;box-shadow:1px 3px 4px #4e261c50;clip-path:polygon(1% 6%,99% 0,98% 96%,0 100%)}

/* Surgical contrast adjustment: blur and slightly darken only the theatrical page backdrop. */
.panel-screen.game-screen {

.panel-screen.game-screen::before {
  content: "" !important;

 rudolphVisualState={index:null,side:null,phase:'hidden'};
}
function clearRudolphTimers(){rudolphTimers.forEach(clearTimeout);rudolphTimers=[];rudolphRunToken++;}
function getRudolphCue(index){
 if(!Object.prototype.hasOwnProperty.call(RUDOLPH_PLAN,index))return null;
 const side=RUDOLPH_PLAN[index];
 const seed=(index*9301+49297)%233280;
 return {side,delay:1800+(seed%500),hold:1050+(seed%200)};
}
function scheduleRudolphCue(index){
 const cue=getRudolphCue(index);
 if(state.view==='host'||!cue||game?.phase!=='started'||game?.revealed)return;
 if(rudolphScheduledQuestion===index)return;
 clearRudolphTimers();
 rudolphScheduledQuestion=index;
 rudolphVisualState={index,side:cue.side,phase:'waiting'};
 if(rudolphPlayedQuestions.has(index)){rudolphVisualState.phase='done';return;}
 const token=++rudolphRunToken;
 rudolphTimers.push(setTimeout(()=>{
   if(token!==rudolphRunToken)return;
   const liveOverlay=document.querySelector('.theatre-art .rudolph-overlay');
   if(!liveOverlay || !document.body.contains(liveOverlay))return;
   rudolphPlayedQuestions.add(index);persistRudolphPlayed();
   rudolphVisualState={index,side:cue.side,phase:'show'};
   liveOverlay.style.zIndex='30';
   liveOverlay.style.visibility='visible';
   liveOverlay.style.opacity='1';
   liveOverlay.classList.add('show');
   rudolphTimers.push(setTimeout(()=>{
     if(token!==rudolphRunToken)return;
     const outOverlay=document.querySelector('.theatre-art .rudolph-overlay');
     if(!outOverlay)return;
     rudolphVisualState={index,side:cue.side,phase:'hide'};
     outOverlay.classList.add('hide');
     rudolphTimers.push(setTimeout(()=>{
       if(token!==rudolphRunToken)return;
       const finishedOverlay=document.querySelector('.theatre-art .rudolph-overlay');
       if(finishedOverlay){
         finishedOverlay.classList.remove('show','hide');
         finishedOverlay.style.visibility='hidden';
         finishedOverlay.style.opacity='0';
       }
       rudolphVisualState={index,side:cue.side,phase:'done'};
     },450));
   },cue.hold));
 },cue.delay));
}
function renderRudolphOverlay(index){
 const cue=getRudolphCue(index);
 if(state.view==='host'||!cue||game?.revealed)return '';
 const phase=rudolphVisualState.index===index?rudolphVisualState.phase:'waiting';
 const classes=phase==='show'?' show':phase==='hide'?' show hide':'';
 return `<div class="rudolph-overlay rudolph-${cue.side}${classes}" aria-hidden="true"><img class="rudolph-figure" src="${RUDOLPH_IMAGE}" alt=""/></div>`;
}

async function lobbyRequest(action, body={}) {
  const res = await fetch('/api/lobby', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:GAME_CODE,...body})});
  const data = await res.json().catch(()=>({error:'Server unavailable'}));
  if (!res.ok) throw new Error(data.error || 'Unable to connect to the lobby');
  return data;
}
function stopLobbyPoll(){if(lobbyPoll){clearInterval(lobbyPoll);lobbyPoll=null;}}
function startLobbyPoll(){stopLobbyPoll();lobbyPoll=setInterval(refreshLobby,2500);}
async function refreshLobby(){
  if(state.view!=='lobby' && state.view!=='host' && state.view!=='quiz' && state.view!=='results')return;
  try {const data=await lobbyRequest('status',{token:state.view==='host'?hostToken:playerToken});state.lobby=data;state.lobbyError='';if(data.phase==='started'||data.phase==='finished')await refreshGame();else render();}
  catch(e){state.lobbyError=e.message;render();}
}
async function joinLobby(){
  const name=(document.getElementById('nameInput')?.value||'').trim();
  if(!name){state.lobbyError='Please enter your name.';renderGateway();return;}
  state.busy=true;state.player=name;
  try{const data=await lobbyRequest('join',{name,token:playerToken});playerToken=data.token;sessionStorage.setItem('lamda_player_token',playerToken);sessionStorage.setItem('lamda_player_name',name);state.lobby=data;state.lobbyError='';state.view='lobby';startLobbyPoll();render();}
  catch(e){state.lobbyError=e.message;state.view='gateway';render();}
  finally{state.busy=false;}
}
async function openHost(){
  state.view='host';state.lobbyError='';render();
  try{const data=await lobbyRequest('host',{token:hostToken});hostToken=data.token;sessionStorage.setItem('lamda_host_token',hostToken);state.lobby=data;hostPinSet=!!data.pinSet;startLobbyPoll();render();}
  catch(e){state.lobbyError=e.message;render();}
}
async function unlockHost(){

 try{const data=await lobbyRequest('host',{pin});hostToken=data.token;sessionStorage.setItem('lamda_host_token',hostToken);hostPinSet=!!data.pinSet;state.lobby=data;state.lobbyError='';startLobbyPoll();render();}

async function saveHostPin(){

 try{const data=await lobbyRequest('set_pin',{token:hostToken,pin});hostPinSet=true;state.lobby=data;state.lobbyError='';render();}

}
async function hostStart(){

async function resetLobby(){

  try{resetRudolphPlayed();state.lobby=await lobbyRequest('reset',{token:hostToken});game=null;answerDraft='';answerDraftQuestion=-1;render();}

  if(state.view === 'landing') return renderLanding();
  if(state.view === 'gateway') return renderGateway();
  if(state.view === 'quiz') return renderGame();
  if(state.view === 'results') return renderGame();
  if(state.view === 'lobby') return renderLobby();
  if(state.view === 'host') return renderHost();

async function gameRequest(action,extra={}){
 const res=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:state.view==='host'?hostToken:playerToken,...extra})});
 const data=await res.json();if(!res.ok)throw Error(data.error||'Game unavailable');return data;
}
async function refreshGame(){
 if(gameBusy)return;
 try{
  const previousGame=game;
  const previousIndex=game?.index;
  const previousSnapshot=previousGame ? JSON.stringify(previousGame) : '';
  const resultsList=document.querySelector('.results-live-list');
  const previousResultsScroll=resultsList ? resultsList.scrollTop : 0;
  game=await gameRequest('status');if(game?.rudolphPlan)acceptSharedRudolphPlan(game.rudolphPlan);state.lobbyError='';
  if(previousIndex!==undefined && previousIndex!==game.index){answerDraft='';answerDraftQuestion=-1;}
  if(state.view!=='host' && document.activeElement?.id==='gameAnswer' && game.phase==='started' && !game.answer && !game.revealed) return;
  // Do not rebuild an unchanged question every polling interval. Rebuilding
  // used to restart Rudolph's timer before it could reach its appearance time.
  if(previousSnapshot !== JSON.stringify(game)) render();
  if(game.phase==='finished' && previousResultsScroll>0){
   const updatedResultsList=document.querySelector('.results-live-list');
   if(updatedResultsList) updatedResultsList.scrollTop=previousResultsScroll;
  }
 }
 catch(e){state.lobbyError=e.message;render();}
}
async function doGame(action,extra={}){
 if(gameBusy)return;gameBusy=true;
 try{game=await gameRequest(action,extra);state.lobbyError='';render();}
 catch(e){state.lobbyError=e.message;render();}
 finally{gameBusy=false;}
}

  if(!questionArtworkLoading)app.innerHTML='<section class="panel-screen" role="status" aria-label="Loading question artwork"></section>';
  prepareQuestionArtwork();
  return;
 }
 const i=game.index;
 const answers=isHost?(game.answers||[]).filter(a=>a.question_index===i):[];

function fitQuestionText(){
 const fit=()=>{
  const el=document.querySelector('.theatre-art .question-copy');
  if(!el)return;
  const base=parseFloat(el.dataset.baseFont)||parseFloat(getComputedStyle(el).fontSize)||18;
  const min=11;
  el.style.setProperty('box-sizing','border-box','important');
  el.style.setProperty('min-height','0','important');
  el.style.setProperty('overflow','hidden','important');
  el.style.setProperty('line-height','1.12','important');
  let low=min,high=base,best=min;
  el.style.setProperty('font-size',base+'px','important');
  if(el.scrollHeight<=el.clientHeight+1)best=base;
  else{
   for(let n=0;n<14;n++){
    const mid=(low+high)/2;
    el.style.setProperty('font-size',mid+'px','important');
    if(el.scrollHeight<=el.clientHeight+1){best=mid;low=mid;}
    else high=mid;
   }
  }
  el.style.setProperty('font-size',best+'px','important');
 };
 fit();
 requestAnimationFrame(()=>{fit();requestAnimationFrame(fit);});
}
async function submitGameAnswer(){
 const v=(document.getElementById('gameAnswer')?.value||answerDraft).trim();
 if(!v)return;
 answerDraft=v;
 await doGame('answer',{answer:v});
}
function pressedAction(button, action){
  if(button.disabled || button.dataset.pressing === 'true') return;
  button.dataset.pressing = 'true';
  button.classList.add('button-confirmed');
  window.setTimeout(() => { action(); }, 190);
}
function escapeHtml(s){return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function enterQuiz(){ state.view='gateway'; state.lobbyError=''; render(); }
function goBack(){ state.view='landing'; render(); }
// Restore the existing session after a refresh instead of returning to the landing page.
async function restoreSession(){
 const params=new URLSearchParams(location.search);
 if(params.get('host')==='1'){
  await openHost();
  if(hostToken && (state.lobby?.phase==='started'||state.lobby?.phase==='finished')) await refreshGame();
  return;
 }
 if(!playerToken){render();return;}
 state.player=sessionStorage.getItem('lamda_player_name')||'';
 try{
  const data=await lobbyRequest('status',{token:playerToken});
  state.lobby=data;
  state.lobbyError='';
  if(data.phase==='started'||data.phase==='finished'){
   state.view='quiz';
   await refreshGame();
  }else{
   state.view='lobby';
   render();
  }
  startLobbyPoll();
 }catch(e){
  // The token may belong to a lobby that has since been cleared.
  sessionStorage.removeItem('lamda_player_token');
  sessionStorage.removeItem('lamda_player_name');
  playerToken='';
  state.view='landing';
  render();
 }
}
restoreSession();
