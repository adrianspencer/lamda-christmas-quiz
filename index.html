<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151018">
<title>LAMDA Christmas Quiz · Class of 1988</title>
<style>
:root{
  --bg1:#120d13;--bg2:#2c1625;--panel:rgba(22,16,24,.92);--panel-soft:rgba(22,16,24,.78);
  --border:rgba(255,255,255,.14);--text:#fff8f9;--muted:#d9c5cf;--accent:#e22247;--accent2:#ff9f84;
  font-family:Inter,"Avenir Next",Avenir,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#55253a 0%,#211521 42%,#120d13 100%);color:var(--text)}
body{min-height:100svh}button,input{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}
.hidden{display:none!important}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px 14px 40px}.wrap{width:min(1180px,100%)}
.hero{position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--border);background:linear-gradient(180deg,#251520 0%,#171018 100%);box-shadow:0 30px 90px rgba(0,0,0,.48);padding:24px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 22%,rgba(255,220,158,.17) 0%,transparent 24%),linear-gradient(180deg,transparent 0%,rgba(0,0,0,.12) 38%,rgba(0,0,0,.34) 100%);pointer-events:none}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.slash{width:10px;height:34px;background:var(--accent);transform:skew(-18deg);display:block}.brandwords{display:flex;flex-direction:column;gap:2px}.brandwords strong{font-size:22px;letter-spacing:-.05em}.brandwords small{font-size:10px;letter-spacing:.22em;font-weight:800;color:#e6c8d1}
.tag{font-size:12px;color:#f2d2db;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
.stage{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(310px,.85fr);gap:24px;align-items:center;min-height:680px}
.scene{position:relative;min-height:620px;border-radius:24px;background:radial-gradient(circle at 50% 28%,rgba(96,51,74,.28),transparent 34%)}
.curtain{position:absolute;top:-10px;bottom:-16px;width:16%;background:linear-gradient(90deg,#5f1129 0%,#9f193b 18%,#75102e 43%,#4d0d21 100%);filter:drop-shadow(0 16px 16px rgba(0,0,0,.28));opacity:.98}
.curtain.left{left:-8px;border-radius:0 0 20px 0}.curtain.right{right:-8px;border-radius:0 0 0 20px}
.garland{position:absolute;left:10%;right:10%;top:8px;height:74px;border-radius:0 0 40px 40px;background:linear-gradient(180deg,#225332 0%,#163f27 100%);box-shadow:0 6px 18px rgba(0,0,0,.24)}
.garland::before{content:"";position:absolute;inset:12px 20px auto 20px;height:40px;background:
radial-gradient(circle at 4% 55%,#de284e 0 6px,transparent 7px),
radial-gradient(circle at 14% 24%,#efcb70 0 6px,transparent 7px),
radial-gradient(circle at 25% 68%,#de284e 0 6px,transparent 7px),
radial-gradient(circle at 36% 22%,#efcb70 0 6px,transparent 7px),
radial-gradient(circle at 47% 70%,#de284e 0 6px,transparent 7px),
radial-gradient(circle at 58% 24%,#efcb70 0 6px,transparent 7px),
radial-gradient(circle at 69% 68%,#de284e 0 6px,transparent 7px),
radial-gradient(circle at 80% 28%,#efcb70 0 6px,transparent 7px),
radial-gradient(circle at 92% 64%,#de284e 0 6px,transparent 7px)}
.floor{position:absolute;left:6%;right:6%;bottom:26px;height:140px;background:linear-gradient(180deg,#32202a 0%,#181117 100%);border-radius:18px;box-shadow:inset 0 20px 60px rgba(255,255,255,.03)}
.laptop{position:absolute;left:9%;right:18%;bottom:78px;z-index:2}
.laptop .screen{min-height:auto;display:block;padding:0;aspect-ratio:16/10;border-radius:18px 18px 10px 10px;background:#0c0d0f;border:9px solid #353740;box-shadow:0 18px 45px rgba(0,0,0,.45);overflow:hidden;position:relative}
.laptop .screen img{width:100%;height:100%;object-fit:cover;object-position:center}
.laptop .screen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,11,18,.05) 0%,rgba(14,11,18,.18) 100%)}
.overlay-title{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;gap:16px;align-items:start}
.overlay-title .tiny{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#ffebef;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.overlay-title .badge{background:rgba(226,34,71,.92);color:white;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;letter-spacing:.08em}
.enter-btn{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);border:none;border-radius:999px;background:linear-gradient(110deg,var(--accent),#b20f33);color:white;padding:14px 24px;font-weight:900;letter-spacing:.05em;box-shadow:0 10px 24px rgba(118,11,37,.46)}
.laptop .base{width:116%;height:18px;margin-left:-8%;background:linear-gradient(180deg,#969ba5 0%,#717783 100%);border-radius:0 0 30px 30px;box-shadow:0 8px 18px rgba(0,0,0,.34)}
.phone{position:absolute;right:10%;bottom:118px;width:20%;min-width:118px;z-index:3;transform:rotate(4deg)}
.phone .frame{border:8px solid #272a30;border-radius:26px;background:#090a0c;box-shadow:0 18px 36px rgba(0,0,0,.42);overflow:hidden;aspect-ratio:9/19.5;position:relative}
.phone .frame::before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40%;height:10px;background:#23262c;border-radius:999px;z-index:2}
.phone-screen{position:absolute;inset:0;padding:28px 12px 12px;background:linear-gradient(180deg,rgba(45,25,37,.86),rgba(22,15,24,.96));display:flex;flex-direction:column;gap:9px}
.phone-screen .micro{font-size:10px;color:#ff96a7;letter-spacing:.14em;text-transform:uppercase;font-weight:800}.phone-screen h4{margin:0;font-size:14px;line-height:1.14;letter-spacing:-.03em}.phone-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:8px 9px;font-size:10px;color:#f1dde4;line-height:1.35}.phone-option{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 8px;font-size:9px;color:#fff}
.prop{position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);box-shadow:0 14px 30px rgba(0,0,0,.24)}
.clipboard{left:2%;top:128px;width:86px;height:118px;border-radius:12px;transform:rotate(-10deg)}.clipboard::before{content:"";position:absolute;left:22px;right:22px;top:-10px;height:16px;border-radius:8px;background:#b89256}.clipboard::after{content:"CUE\A SHEET";white-space:pre;position:absolute;inset:22px 14px auto 14px;font-size:13px;line-height:1.6;color:#f0dfe5;font-weight:700}
.tape{left:8%;bottom:46px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at center,transparent 0 17px,#161218 18px 23px,#2b2f35 24px 31px,#0b0c10 32px 37px,transparent 38px), linear-gradient(180deg,#404752,#171b20)}
.maglite{right:3%;top:170px;width:132px;height:20px;border-radius:999px;background:linear-gradient(90deg,#3a3f48 0%,#21252c 52%,#4a515c 78%,#5d6570 100%);transform:rotate(-26deg)}.maglite::after{content:"";position:absolute;right:-14px;top:-5px;width:34px;height:30px;border-radius:50%;background:linear-gradient(180deg,#6d7480,#3b4149);box-shadow:inset -3px -4px 8px rgba(0,0,0,.25)}
.gaffer{right:18%;top:86px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,transparent 0 16px,#121319 17px 24px,#2d3139 25px 38px,transparent 39px)}
.headset{right:2%;bottom:38px;width:116px;height:88px;border-radius:50%;border:8px solid #2b2f36;border-bottom-color:transparent;border-left-color:#3a4048;background:transparent;transform:rotate(10deg)}.headset::before,.headset::after{content:"";position:absolute;width:28px;height:40px;border-radius:13px;background:#2f333b;bottom:-10px}.headset::before{left:0}.headset::after{right:0}.headset span{position:absolute;right:-18px;bottom:10px;width:42px;height:6px;background:#474d58;border-radius:6px;transform:rotate(-18deg)}
.copy{position:relative;z-index:2;padding:10px 10px 10px 0}.eyebrow{font-size:12px;letter-spacing:.18em;color:#ff90a2;text-transform:uppercase;font-weight:800;margin-bottom:10px}.copy h1{margin:0 0 14px;font-size:clamp(36px,6.1vw,64px);line-height:.97;letter-spacing:-.058em}.copy p{margin:0;color:var(--muted);font-size:17px;line-height:1.6;max-width:420px}.copy .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{appearance:none;border:none;border-radius:15px;padding:15px 20px;font-weight:800;min-height:54px;transition:transform .12s ease}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(110deg,var(--accent),#b20f33);color:white;box-shadow:0 12px 24px rgba(118,11,37,.34)}.btn-secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:white}
.footnote{margin-top:14px;font-size:12px;color:#baa8b0;line-height:1.5}
.panel-screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px 12px 36px}.panel-wrap{width:min(760px,100%)}.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:8px 4px 14px}.mini{font-size:12px;color:#d5c1ca}.panel{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:26px 18px 20px;box-shadow:0 24px 70px rgba(0,0,0,.36)}.panel h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);line-height:1.06;letter-spacing:-.04em}.panel p{margin:0;color:var(--muted);line-height:1.6}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ecd0d7;font-weight:800}.field input{width:100%;min-height:50px;border-radius:14px;padding:14px 15px;background:#19121a;border:1px solid rgba(255,255,255,.14);color:white;outline:none}.field input:focus{border-color:#ff8898;box-shadow:0 0 0 3px rgba(255,136,152,.12)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.notice{margin-top:18px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:14px;color:#eedde3;line-height:1.5}
.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px 0 24px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.question{font-size:clamp(24px,4vw,35px);font-weight:800;line-height:1.22;letter-spacing:-.04em;margin-bottom:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{appearance:none;width:100%;text-align:left;border-radius:16px;min-height:70px;padding:15px 16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:white;font-weight:750;display:flex;align-items:center;gap:12px}.choice .letter{width:30px;height:30px;border-radius:50%;background:#982241;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 30px}.choice.selected{border-color:#ff8798;background:rgba(155,25,63,.25)}.choice.correct{border-color:#4adb9c;background:rgba(33,101,63,.34)}.choice.incorrect{border-color:#ff6d8d;background:rgba(155,25,63,.36)}.small{font-size:14px;color:var(--muted);line-height:1.55;margin-top:12px}.result{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:12px 0 16px}.footer{text-align:center;font-size:11px;color:#bbaab1;letter-spacing:.06em;padding:16px 4px 0}
@media (max-width:1020px){.stage{grid-template-columns:1fr;gap:12px;min-height:auto}.scene{min-height:520px}.copy{padding:0 8px 10px}}
@media (max-width:760px){.hero{padding:14px}.top{margin-bottom:12px}.brandwords strong{font-size:19px}.stage{gap:18px}.scene{min-height:410px}.laptop{left:6%;right:19%;bottom:72px}.phone{width:24%;right:7%;bottom:100px}.choices{grid-template-columns:1fr}.clipboard,.maglite,.gaffer,.headset{display:none}.copy h1{font-size:40px}.copy p{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const questions=[
 {q:'Where did our story begin?',a:['Tower House','Our house','The MacOwan Theatre','In the church hall'],correct:1},
 {q:'What does DSM stand for in theatre?',a:['Deputy Stage Manager','Director of Stage Movement','Drama Stage Mentor','Design & Stage Mechanics'],correct:0},
 {q:'How does this quiz work?',a:['People are eliminated','Everyone stays in to the end','Only the host scores points','Answers are on paper'],correct:1}
];
const letters=['A','B','C','D'];
let state={screen:'landing',name:'',index:0,score:0,selected:null,answered:false};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){if(state.screen==='landing')landing();else if(state.screen==='join')join();else if(state.screen==='waiting')waiting();else if(state.screen==='quiz')quiz();else result();}
function header(){return `<div class="brand"><span class="slash"></span><div class="brandwords"><strong>LAMDA Christmas Quiz</strong><small>CLASS OF 1988</small></div></div>`}
function landing(){app.innerHTML=`<section class="screen"><div class="wrap hero"><div class="top">${header()}<div class="tag">The reunion starts here</div></div><div class="stage"><div class="scene"><div class="curtain left"></div><div class="curtain right"></div><div class="garland"></div><div class="floor"></div><div class="prop clipboard"></div><div class="prop tape"></div><div class="prop maglite"></div><div class="prop gaffer"></div><div class="prop headset"><span></span></div><div class="laptop"><div class="screen"><img src="https://qattanfoundation.org/sites/default/files/outside-ar.jpg" alt="Tower House at 226 Cromwell Road"><div class="overlay-title"><div class="tiny">Tower House · 226 Cromwell Road</div><div class="badge">Class of 1988</div></div><button class="enter-btn" id="heroEnter">ENTER THE QUIZ →</button></div><div class="base"></div></div><div class="phone"><div class="frame"><div class="phone-screen"><div class="micro">Phone view</div><h4>What’s your name?</h4><div class="phone-card">Players join on their phones. Adrian hosts on Zoom.</div><div class="phone-option">One question at a time</div><div class="phone-option">No elimination</div><div class="phone-option">Scores totalled at the end</div></div></div></div></div><div class="copy"><div class="eyebrow">Christmas reunion</div><h1>Back through the door.</h1><p>The actual Tower House photograph stays inside the laptop screen. Click Enter, then go straight to name entry — no weird zoom into the building.</p><div class="actions"><button class="btn btn-primary" id="sideEnter">ENTER THE QUIZ →</button><button class="btn btn-secondary" id="tryBtn">TRY THE REHEARSAL</button></div><div class="footnote">This is the revised front page: same theatrical landing idea, but with the real Tower House photo replacing the invented image.</div></div></div></div></section>`;
 document.getElementById('heroEnter').onclick=()=>{state.screen='join';render();};
 document.getElementById('sideEnter').onclick=()=>{state.screen='join';render();};
 document.getElementById('tryBtn').onclick=()=>{state.screen='join';render();};
}
function join(){app.innerHTML=`<section class="panel-screen"><div class="panel-wrap"><div class="panel-head">${header()}<div class="mini">Name entry</div></div><div class="panel"><div class="eyebrow">Welcome back</div><h2>What’s your name?</h2><p>Everyone stays in all the way through. We just tot up the points at the end.</p><div class="field"><label for="name">Your name</label><input id="name" maxlength="40" placeholder="Type your name" value="${esc(state.name)}"></div><div class="row"><button class="btn btn-secondary" id="back">Back</button><button class="btn btn-primary" id="joinNow">JOIN →</button></div><div class="notice">In the live version, everyone does this on their own phone while you host on Zoom.</div></div><div class="footer">PHONE-FIRST FLOW · NO APP INSTALL NEEDED</div></div></section>`;
 document.getElementById('back').onclick=()=>{state.screen='landing';render();};
 document.getElementById('joinNow').onclick=()=>{const v=document.getElementById('name').value.trim();if(!v){document.getElementById('name').focus();return;}state.name=v;state.screen='waiting';render();};
}
function waiting(){app.innerHTML=`<section class="panel-screen"><div class="panel-wrap"><div class="panel-head">${header()}<div class="mini">Waiting room</div></div><div class="panel"><div class="eyebrow">You’re in</div><h2>Welcome, ${esc(state.name)}.</h2><p>Leave this open. Adrian starts the quiz when everybody’s arrived.</p><div class="notice">This preview is a one-device rehearsal. The live version will sync all players.</div><div class="row" style="margin-top:20px"><button class="btn btn-secondary" id="edit">Edit name</button><button class="btn btn-primary" id="start">START REHEARSAL →</button></div></div><div class="footer">ALL PLAYERS STAY IN · ONE QUESTION AT A TIME</div></div></section>`;
 document.getElementById('edit').onclick=()=>{state.screen='join';render();};
 document.getElementById('start').onclick=()=>{state.index=0;state.score=0;state.selected=null;state.answered=false;state.screen='quiz';render();};
}
function quiz(){const q=questions[state.index];app.innerHTML=`<section class="panel-screen"><div class="panel-wrap"><div class="panel-head">${header()}<div class="mini">Question ${state.index+1} / ${questions.length}</div></div><div class="panel"><div class="eyebrow">Question ${state.index+1} / ${questions.length}</div><div class="progress"><span style="width:${((state.index+1)/questions.length)*100}%"></span></div><div class="question">${esc(q.q)}</div><div class="choices">${q.a.map((ans,i)=>`<button class="choice ${choiceClass(i,q)}" data-i="${i}" ${state.answered?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(ans)}</span></button>`).join('')}</div><p class="small">${state.answered?(state.selected===q.correct?'Correct.':'Correct answer: '+esc(q.a[q.correct])):'Choose one answer. In the live version, Adrian reveals and advances each question.'}</p><div class="row" style="margin-top:18px">${state.answered?`<button class="btn btn-primary" id="next">${state.index===questions.length-1?'SEE RESULTS →':'NEXT QUESTION →'}</button>`:''}</div></div><div class="footer">HOST TALKS ON ZOOM · PLAYERS ANSWER HERE</div></div></section>`;
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(Number(b.dataset.i)));
 const n=document.getElementById('next'); if(n) n.onclick=()=>{if(state.index===questions.length-1){state.screen='result';render();}else{state.index++;state.selected=null;state.answered=false;render();}};
}
function choiceClass(i,q){if(!state.answered)return state.selected===i?'selected':'';if(i===q.correct)return 'correct';if(i===state.selected && i!==q.correct)return 'incorrect';return ''}
function pick(i){if(state.answered)return;state.selected=i;state.answered=true;if(i===questions[state.index].correct)state.score++;render();}
function result(){app.innerHTML=`<section class="panel-screen"><div class="panel-wrap"><div class="panel-head">${header()}<div class="mini">Curtain call</div></div><div class="panel"><div class="eyebrow">Rehearsal complete</div><h2>Nice one, ${esc(state.name)}.</h2><div class="result">${state.score} / ${questions.length}</div><p>This keeps the flow simple: theatrical landing page, name entry, waiting room, one question at a time, final score.</p><div class="row" style="margin-top:20px"><button class="btn btn-secondary" id="home">HOME</button><button class="btn btn-primary" id="again">PLAY AGAIN ↻</button></div></div><div class="footer">NEXT STEP: LIVE MULTIPLAYER VERSION</div></div></section>`;
 document.getElementById('home').onclick=()=>{state.screen='landing';render();};document.getElementById('again').onclick=()=>{state.index=0;state.score=0;state.selected=null;state.answered=false;state.screen='quiz';render();};
}
render();
</script>
</body>
</html>
